
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora Sohbet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#202124}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:12px 16px;background:#2563eb;color:white}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;outline:none}
input:focus{border-color:#2563eb}
#login{max-width:390px;margin:90px auto;padding:25px;background:white;border-radius:16px;box-shadow:0 3px 18px #0001}
#login h1{text-align:center;color:#2563eb}
#login button{width:100%;margin-top:12px}
#app{display:none;max-width:1100px;height:100dvh;margin:auto;background:white}
header{height:60px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
header strong{font-size:21px;color:#2563eb}
#layout{display:flex;height:calc(100% - 60px)}
#sidebar{width:320px;border-right:1px solid #eee;padding:15px;overflow:auto}
#sidebar h3{margin:8px 0 15px}
#search{margin-bottom:12px}
.user{padding:13px;border-radius:9px;cursor:pointer;border-bottom:1px solid #eee}
.user:hover,.user.active{background:#eff6ff}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#chatTitle{padding:16px;border-bottom:1px solid #eee;font-weight:bold}
#messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:11px 14px;border-radius:13px;background:#f0f0f0;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:#dbeafe}
.msg small{display:block;color:#777;font-size:10px;margin-top:5px}
#sendArea{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
#sendArea input{flex:1;min-width:0}
#sendArea button{padding:0 20px}
#status{font-size:12px;color:#777;text-align:center;padding:8px}
#error{color:#c62828;font-size:13px;margin-top:12px;overflow-wrap:anywhere}
#logout{background:#eee;color:#333;padding:8px 12px}
#empty{margin:auto;text-align:center;color:#888;padding:20px}
@media(max-width:650px){
 #sidebar{width:38%;padding:9px}
 #chat{width:62%}
 #messages{padding:10px}
 .msg{max-width:90%}
 header{padding:0 12px}
 #sidebar input{padding:10px 7px}
}
</style>
</head>
<body>

<div id="login">
<h1>Nexora</h1>
<p style="text-align:center;color:#777">Kullanıcı adını oluştur ve sohbete başla.</p>
<input id="username" maxlength="20" placeholder="Kullanıcı adı (3-20 karakter)">
<button id="register">Devam et</button>
<div id="error"></div>
</div>

<div id="app">
<header>
<strong>Nexora</strong>
<div>
<span id="myName"></span>
<button id="logout">Çıkış</button>
</div>
</header>
<div id="layout">
<aside id="sidebar">
<h3>Kişiler</h3>
<input id="search" placeholder="Kullanıcı adı ara...">
<div id="users"></div>
</aside>
<main id="chat">
<div id="chatTitle">Bir kişi seç</div>
<div id="messages"><div id="empty">Sohbet etmek için bir kullanıcı ara.</div></div>
<div id="status"></div>
<div id="sendArea">
<input id="messageInput" placeholder="Mesajını yaz..." maxlength="2000" disabled>
<button id="send" disabled>Gönder</button>
</div>
</main>
</div>
</div>

<script>
const SUPABASE_URL = "https://qddemnxngjjiwcmisqtb.supabase.co";
const SUPABASE_KEY = "sb_publishable_uAiMJd3Q6lyzoUOsKNhpuw_FbUFzxk_";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let myId = null;
let myProfile = null;
let selectedUser = null;
let refreshTimer = null;

const $ = id => document.getElementById(id);

function showError(message) {
  $("error").textContent = message;
}

function showApp() {
  $("login").style.display = "none";
  $("app").style.display = "block";
  $("myName").textContent = myProfile.username;
}

async function start() {
  $("register").disabled = true;
  showError("Bağlanılıyor...");

  try {
    let { data: { session }, error } = await db.auth.getSession();
    if (error) throw error;

    if (!session) {
      const result = await db.auth.signInAnonymously();
      if (result.error) throw result.error;
      session = result.data.session;
    }

    myId = session.user.id;

    const result = await db
      .from("profiles")
      .select("*")
      .eq("id", myId)
      .maybeSingle();

    if (result.error) throw result.error;

    if (result.data) {
      myProfile = result.data;
      enterApp();
    } else {
      showError("");
      $("register").disabled = false;
    }
  } catch (e) {
    showError("Bağlantı hatası: " + e.message);
    $("register").disabled = false;
  }
}

function enterApp() {
  showApp();
  loadUsers();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    loadUsers();
    if (selectedUser) loadMessages();
  }, 3000);
}

async function register() {
  const username = $("username").value.trim();

  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
    showError("Kullanıcı adı 3-20 karakter olmalı. Yalnızca İngilizce harf, rakam ve _ kullanabilirsin.");
    return;
  }

  $("register").disabled = true;
  showError("Kullanıcı adı kontrol ediliyor...");

  try {
    const check = await db
      .from("profiles")
      .select("id,username")
      .ilike("username", username)
      .limit(1);

    if (check.error) throw check.error;

    if (check.data && check.data.length > 0) {
      showError("Bu kullanıcı adı zaten alınmış. Başka bir ad dene.");
      $("register").disabled = false;
      return;
    }

    const result = await db
      .from("profiles")
      .insert({
        id: myId,
        username: username
      })
      .select()
      .single();

    if (result.error) {
      if (result.error.code === "23505") {
        showError("Bu kullanıcı adı zaten alınmış. Başka bir ad dene.");
      } else {
        showError("Kayıt başarısız (" + (result.error.code || "hata") + "): " + result.error.message);
      }
      $("register").disabled = false;
      return;
    }

    myProfile = result.data;
    enterApp();

  } catch (e) {
    showError("Kayıt sırasında hata: " + e.message);
    $("register").disabled = false;
  }
}

async function loadUsers() {
  const q = $("search").value.trim();

  let query = db
    .from("profiles")
    .select("id,username")
    .neq("id", myId)
    .order("username")
    .limit(50);

  if (q) query = query.ilike("username", "%" + q.replace(/[%_,]/g, "") + "%");

  const { data, error } = await query;

  if (error) {
    $("users").textContent = "Kullanıcılar yüklenemedi: " + error.message;
    return;
  }

  $("users").innerHTML = "";

  if (!data.length) {
    $("users").textContent = q ? "Kullanıcı bulunamadı." : "Henüz başka kullanıcı yok.";
    return;
  }

  data.forEach(user => {
    const div = document.createElement("div");
    div.className = "user" + (selectedUser?.id === user.id ? " active" : "");
    div.textContent = user.username;
    div.onclick = () => openChat(user);
    $("users").appendChild(div);
  });
}

async function openChat(user) {
  selectedUser = user;
  $("chatTitle").textContent = user.username;
  $("messageInput").disabled = false;
  $("send").disabled = false;
  await loadUsers();
  await loadMessages();
}

async function loadMessages() {
  if (!selectedUser) return;

  const otherId = selectedUser.id;

  const { data, error } = await db
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${myId},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${myId})`
    )
    .order("created_at", { ascending: true })
    .limit(200);

  if (error) {
    $("status").textContent = "Mesajlar yüklenemedi: " + error.message;
    return;
  }

  const box = $("messages");
  box.innerHTML = "";

  if (!data.length) {
    box.innerHTML = '<div id="empty">Henüz mesaj yok. İlk mesajı sen gönder!</div>';
    return;
  }

  data.forEach(message => {
    const div = document.createElement("div");
    div.className = "msg" + (message.sender_id === myId ? " mine" : "");

    const content = document.createElement("div");
    content.textContent = message.content;

    const time = document.createElement("small");
    time.textContent = new Date(message.created_at).toLocaleString("tr-TR");

    div.append(content, time);
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
  $("status").textContent = "";
}

async function sendMessage() {
  const content = $("messageInput").value.trim();

  if (!content || !selectedUser) return;

  $("send").disabled = true;

  const { error } = await db.from("messages").insert({
    sender_id: myId,
    receiver_id: selectedUser.id,
    content: content
  });

  $("send").disabled = false;

  if (error) {
    $("status").textContent = "Mesaj gönderilemedi: " + error.message;
    return;
  }

  $("messageInput").value = "";
  await loadMessages();
}

$("register").addEventListener("click", register);
$("search").addEventListener("input", loadUsers);
$("send").addEventListener("click", sendMessage);
$("messageInput").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

$("logout").addEventListener("click", async () => {
  if (!confirm("Bu cihazdaki oturumdan çıkmak istiyor musun?")) return;
  await db.auth.signOut();
  location.reload();
});

start();
</script>
</body>
</html>
